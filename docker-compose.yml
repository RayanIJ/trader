# Automated Options Trading Cockpit — full stack
#
#   docker compose up -d --build
#   open http://127.0.0.1:3000  (dashboard)
#   API http://127.0.0.1:8000   (backend)
#   VNC localhost:5900            (IB 2FA, password VNC_PASSWORD)
#
# Stop host-native backend/frontend before starting to avoid port conflicts.
services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: ib-gateway
    restart: unless-stopped
    ports:
      - "4002:4002"
      - "4001:4001"
      - "4004:4004" # Paper socat relay
      - "4003:4003" # Live socat relay (cockpit connects here)
      - "5900:5900" # VNC for 2FA
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-live}
      TWS_API_PORT: 4001
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD:-123456}
      EXISTING_SESSION_DETECTED_ACTION: primary
      TWOFA_TIMEOUT_ACTION: restart
      AUTO_RESTART_TIME: "11:59 PM"
      TIME_ZONE: Etc/UTC
      # Auto-accept API connections (no manual dialog in headless gateway).
      TWS_ACCEPT_INCOMING: accept
    networks:
      - cockpit

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trading-cockpit-backend
    restart: unless-stopped
    depends_on:
      - ib-gateway
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      FRONTEND_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      IB_HOST: ib-gateway
      IB_PAPER_PORT: 4003
      IB_LIVE_PORT: 4003
      # Dedicated client id inside Docker (avoid clashing with a host TWS session on id 1).
      IB_CLIENT_ID: "2"
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-tws}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    networks:
      - cockpit
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_BACKEND_URL: ""
    container_name: trading-cockpit-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - cockpit

networks:
  cockpit:
    driver: bridge
